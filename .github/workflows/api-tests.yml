name: StudyFlow API - Build & Test

# Runs the REST API's automated tests (auth, tasks, offline-sync idempotency, XP/badges,
# validation) whenever the api/ folder changes.
on:
  push:
    branches: [main]
    tags: ['final-poe*']
    paths: ['api/**', '.github/workflows/api-tests.yml']
  pull_request:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret
          GOOGLE_CLIENT_ID: dummy-client-id
